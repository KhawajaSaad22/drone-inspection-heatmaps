name: Linux tests
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: docker build --target base -t drone-heatmaps .
      - run: docker run --rm drone-heatmaps demo --output /tmp/demo
