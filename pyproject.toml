[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-inspection-heatmaps"
version = "0.1.0"
description = "Tiled drone inspection with compact defect-score heatmaps"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5"]

[project.optional-dependencies]
model = ["rfdetr>=1.3,<2"]

[project.scripts]
drone-inspect = "drone_heatmaps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
